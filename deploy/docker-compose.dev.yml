# Nur die Datenbank für die lokale Entwicklung:
#   docker compose -f deploy/docker-compose.dev.yml up -d
#   DATABASE_URL=postgres://doit:doit@localhost:5432/doit pnpm dev
name: do-it-dev
services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: doit
      POSTGRES_USER: doit
      POSTGRES_PASSWORD: doit
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - devdata:/var/lib/postgresql/data
volumes:
  devdata:
